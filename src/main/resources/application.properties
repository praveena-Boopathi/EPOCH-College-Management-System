spring.application.name=epoch-backend
server.port=${PORT:8083}

epoch.firebase.project-id=epoch-a43c7
epoch.firebase.credentials-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
epoch.firebase.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}
epoch.jwt.secret=${EPOCH_JWT_SECRET}
epoch.jwt.expiration-ms=86400000

# CORS Allowed Origins (comma-separated, supports wildcards like https://*.vercel.app)
epoch.cors.allowed-origins=${EPOCH_CORS_ALLOWED_ORIGINS:}

# Support large request bodies for document uploads (up to 25MB)
server.tomcat.max-http-form-post-size=25MB
server.tomcat.max-swallow-size=25MB
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Standard server error responses as JSON
server.error.include-message=never
server.error.include-binding-errors=never
